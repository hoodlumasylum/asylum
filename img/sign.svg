<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Hoodlum Asylum hanging sign">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1a16"/>
      <stop offset="1" stop-color="#0b0b0a"/>
    </linearGradient>
    <linearGradient id="ly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7ff74"/>
      <stop offset="0.5" stop-color="#c8ff3d"/>
      <stop offset="1" stop-color="#6edc22"/>
    </linearGradient>
    <filter id="neon" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#00e5ff" flood-opacity="0.85"/>
    </filter>
    <filter id="txt" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#00e5ff" flood-opacity="0.7"/>
      <feDropShadow dx="2" dy="3" stdDeviation="0" flood-color="#000" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- hanging chains -->
  <g stroke="#8a8e92" stroke-width="5" fill="none">
    <path d="M150 0 V58"/>
    <path d="M490 0 V58"/>
  </g>
  <g fill="#6a6e72">
    <circle cx="150" cy="64" r="8"/>
    <circle cx="490" cy="64" r="8"/>
  </g>
  <!-- sign board -->
  <rect x="70" y="70" width="500" height="300" rx="18" fill="url(#board)" stroke="#00e5ff" stroke-width="4" filter="url(#neon)"/>
  <rect x="88" y="88" width="464" height="264" rx="10" fill="none" stroke="#00b8cc" stroke-width="1.5" opacity="0.5"/>
  <text x="320" y="200" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="72" font-weight="900" fill="url(#ly)" letter-spacing="6" filter="url(#txt)" transform="rotate(-1 320 200)">HOODLUM</text>
  <text x="320" y="280" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="68" font-weight="900" fill="url(#ly)" letter-spacing="10" filter="url(#txt)" transform="rotate(-1 320 280)">ASYLUM</text>
</svg>
