<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" role="img" aria-label="Hoodlum Asylum">
  <defs>
    <linearGradient id="ly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5ff6a"/>
      <stop offset="0.45" stop-color="#c6ff3a"/>
      <stop offset="1" stop-color="#7adf20"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.2" flood-color="#00e5ff" flood-opacity="0.7"/>
    </filter>
  </defs>
  <g filter="url(#glow)" transform="rotate(-2 140 32)">
    <text x="140" y="28" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="26" font-weight="900" fill="url(#ly)" letter-spacing="3">HOODLUM</text>
    <text x="140" y="54" text-anchor="middle" font-family="Impact, Haettenschweiler, 'Arial Black', sans-serif" font-size="22" font-weight="900" fill="url(#ly)" letter-spacing="4">ASYLUM</text>
  </g>
</svg>
