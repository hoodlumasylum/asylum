<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Podcast microphone illustration">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1014"/>
      <stop offset="1" stop-color="#041018"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd6dc"/>
      <stop offset="0.5" stop-color="#8b949c"/>
      <stop offset="1" stop-color="#4a5258"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="360" rx="16" fill="url(#bg)"/>
  <rect width="640" height="360" fill="url(#glow)"/>
  <!-- desk -->
  <rect x="0" y="300" width="640" height="60" fill="#0b0d10"/>
  <!-- headphones -->
  <g fill="none" stroke="#1a232a" stroke-width="16" stroke-linecap="round">
    <path d="M150 150 A130 110 0 0 1 490 150"/>
  </g>
  <g fill="#151b20" stroke="#00e5ff" stroke-width="2">
    <rect x="108" y="150" width="70" height="90" rx="16"/>
    <rect x="462" y="150" width="70" height="90" rx="16"/>
  </g>
  <!-- mic body -->
  <g transform="translate(320,200)">
    <rect x="-28" y="-90" width="56" height="110" rx="28" fill="url(#metal)" stroke="#00e5ff" stroke-width="2"/>
    <g stroke="#2a3238" stroke-width="3">
      <line x1="-18" y1="-70" x2="18" y2="-70"/>
      <line x1="-18" y1="-55" x2="18" y2="-55"/>
      <line x1="-18" y1="-40" x2="18" y2="-40"/>
      <line x1="-18" y1="-25" x2="18" y2="-25"/>
    </g>
    <rect x="-8" y="16" width="16" height="36" fill="#666"/>
    <rect x="-40" y="50" width="80" height="10" rx="3" fill="#333" stroke="#00e5ff" stroke-width="1"/>
    <rect x="-70" y="60" width="140" height="14" rx="3" fill="#1a1a1a"/>
  </g>
</svg>
